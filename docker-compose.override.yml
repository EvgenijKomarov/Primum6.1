services:
  postgres:
    ports:
      - "4100:5432"

  mongodb:
    ports:
      - "4110:27017"

  rabbitmq:
    ports:
      - "4210:5672"
      - "4211:15672"

  signservice:
    volumes:
      - ./Apps/SignService:/app

  common-notification-service:
    volumes:
      - ./Apps/CommonNotificationService:/app

  email-notification-service:
    volumes:
      - ./Apps/EmailNotificationService:/app

  payment-service:
    environment:
      MODE: "Development"
    volumes:
      - ./Apps/PaymentService:/app

  chat-bot-notification-service:
    volumes:
      - ./Apps/ChatBotNotificationService:/app

  primumwebapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
  
  botcore:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5003:5000"
      
  telegram-bot:
    volumes:
      - ./Libs/BotConnection:/app/Libs/BotConnection
      - ./Apps/TelegramBot:/app/Apps/TelegramBot

  max-bot:
    volumes:
      - ./Libs/BotConnection:/app/Libs/BotConnection
      - ./Apps/MaxBot:/app/Apps/MaxBot
      
  primumcore:
    ports:
      - "5004:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro