name: Release deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: primum6.1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-db-migrate
            context: ./Libs/CoreDBModel
            dockerfile: ./Libs/CoreDBModel/Dockerfile
          - service: signservice
            context: ./Apps/SignService
            dockerfile: ./Apps/SignService/Dockerfile
          - service: common-notification-service
            context: ./Apps/CommonNotificationService
            dockerfile: ./Apps/CommonNotificationService/Dockerfile
          - service: email-notification-service
            context: ./Apps/EmailNotificationService
            dockerfile: ./Apps/EmailNotificationService/Dockerfile
          - service: payment-service
            context: ./Apps/PaymentService
            dockerfile: ./Apps/PaymentService/Dockerfile
          - service: chat-bot-notification-service
            context: ./Apps/ChatBotNotificationService
            dockerfile: ./Apps/ChatBotNotificationService/Dockerfile
          - service: primumcore
            context: .
            dockerfile: ./Apps/PrimumCore/Dockerfile
          - service: primumwebapi
            context: .
            dockerfile: ./Apps/PrimumWebAPI/Dockerfile
          - service: botcore
            context: .
            dockerfile: ./Apps/BotCore/Dockerfile
          - service: coredbiterator
            context: .
            dockerfile: ./Apps/CoreDBIterator/Dockerfile
          - service: primumweb
            context: ./Apps/PrimumWeb
            dockerfile: ./Apps/PrimumWeb/Dockerfile
          - service: telegram-bot
            context: .
            dockerfile: ./Apps/TelegramBot/Dockerfile
          - service: max-bot
            context: .
            dockerfile: ./Apps/MaxBot/Dockerfile
          - service: vk-bot
            context: .
            dockerfile: ./Apps/VkBot/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ env.IMAGE_REPO }}" | tr '[:upper:]' '[:lower:]')
          SVC=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.ref_name }}"
          echo "image=${{ env.REGISTRY }}/${OWNER}/${REPO}/${SVC}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy tag on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            export IMAGE_PREFIX="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/primum6.1"
            /root/deploy/scripts/deploy-tag.sh "${{ github.ref_name }}"
