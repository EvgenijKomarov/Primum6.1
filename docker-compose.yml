services:
  postgres:
    image: postgres:16-alpine
    container_name: primum-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "4100:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    networks:
      - primum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d core_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    
  core-db-migrate:
    build:
      context: ./Libs/CoreDBModel
      dockerfile: Dockerfile
    environment:
      COREDB_URL: "Host=${DB_HOST};Port=${DB_PORT};Database=core_db;Username=${DB_USERNAME};Password=${DB_PASSWORD};SSL Mode=Disable;"
    networks:
      - primum-network
    depends_on:
      postgres:
        condition: service_healthy
    
  mongodb:
    image: mongo:7
    container_name: primum-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "4110:${MONGO_PORT}"
    volumes:
      - mongo-data:/data/db
    networks:
      - primum-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: primum-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "4210:5672"
      - "4211:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - primum-network

  signservice:
    build:
      context: Apps/SignService
      dockerfile: Dockerfile
    container_name: sign-service
    environment:
      MONGO_URI: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/?authSource=admin"
    volumes:
      - ./Apps/SignService:/app
    networks:
      - primum-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  common-notification-service:
    build:
      context: Apps/CommonNotificationService
      dockerfile: Dockerfile
    container_name: common-notification-service
    environment:
      MONGO_URI: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/?authSource=admin"
    volumes:
      - ./Apps/CommonNotificationService:/app
    networks:
      - primum-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  email-notification-service: #вообще взаимозависимы с ядром, хз как фиксить
    build:
      context: Apps/EmailNotificationService
      dockerfile: Dockerfile
    container_name: email-notification-service
    environment:
      CORE_URL: "http://primumcore:5000"
      EMAIL: ${EMAIL}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    volumes:
      - ./Apps/EmailNotificationService:/app
    networks:
      - primum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  payment-service:
    build:
      context: Apps/PaymentService
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      MONGO_URI: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/?authSource=admin"
      MODE: "Development"
    volumes:
      - ./Apps/PaymentService:/app
    networks:
      - primum-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  chat-bot-notification-service:
    build:
      context: Apps/ChatBotNotificationService
      dockerfile: Dockerfile
    container_name: chat-bot-notification-service
    environment:
      SIGNSERVICE_URL: "http://signservice:5000"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/"
    volumes:
      - ./Apps/ChatBotNotificationService:/app
    depends_on:
      - rabbitmq
      - signservice
    networks:
      - primum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  primumcore:
    build:
      context: .
      dockerfile: Apps/PrimumCore/Dockerfile
    container_name: primumcore
    environment:
      CHATBOTNOTIFICATIONSERVICE_URL: "http://chat-bot-notification-service:5000"
      MAILNOTIFICATIONSERVICE_URL: "http://email-notification-service:5000"
      COMMONNOTIFICATIONSERVICE_URL: "http://common-notification-service:5000"
      PAYMENTSERVICE_URL: "http://payment-service:5000"
      SIGNSERVICE_URL: "http://signservice:5000"
      GATEWAY_URL: ${GATEWAY_URL}
      COREDB_URL: "Host=${DB_HOST};Port=${DB_PORT};Database=core_db;Username=${DB_USERNAME};Password=${DB_PASSWORD};SSL Mode=Disable;"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5000"
    depends_on:
      core-db-migrate:
        condition: service_completed_successfully
      email-notification-service:
        condition: service_started
      chat-bot-notification-service:
        condition: service_started
      common-notification-service:
        condition: service_started
      signservice:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "5004:5000"
    networks:
      - primum-network

  primumwebapi:
    build:
      context: .
      dockerfile: Apps/PrimumWebAPI/Dockerfile
    container_name: primumwebapi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      WEBAPI_JWT_ISSUER: ${WEBAPI_JWT_ISSUER}
      WEBAPI_JWT_SEED: ${WEBAPI_JWT_SEED}
      WEBAPI_JWT_AUDIENCE: ${WEBAPI_JWT_AUDIENCE}
      WEBAPI_JWT_LIFETIME_MINUTES: ${WEBAPI_JWT_LIFETIME_MINUTES}
      COMMONNOTIFICATIONSERVICE_URL: "http://common-notification-service:5000"
      PRIMUMCORE_URL: "http://primumcore:5000"
      ASPNETCORE_HTTP_PORTS: "5000"
      PAYMENTSERVICE_URL: "http://payment-service:5000"
    ports:
      - "4200:5000"
    depends_on:
      - primumcore
      - common-notification-service
    networks:
      - primum-network

  botcore:
    build:
      context: .
      dockerfile: Apps/BotCore/Dockerfile
    container_name: botcore
    environment:
      SIGNSERVICE_URL: "http://signservice:5000"
      PRIMUMCORE_URL: "http://primumcore:5000"
      PAYMENTSERVICE_URL: "http://payment-service:5000"
      ASPNETCORE_HTTP_PORTS: "5000"
      GATEWAY_URL: ${GATEWAY_URL}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5003:5000"
    depends_on:
      - primumcore
      - signservice
      - payment-service
    networks:
      - primum-network

  coredbiterator:
    build:
      context: .
      dockerfile: Apps/CoreDBIterator/Dockerfile
    container_name: coredbiterator
    environment:
      CHATBOTNOTIFICATIONSERVICE_URL: "http://chat-bot-notification-service:5000"
      MAILNOTIFICATIONSERVICE_URL: "http://email-notification-service:5000"
      COMMONNOTIFICATIONSERVICE_URL: "http://common-notification-service:5000"
      PAYMENTSERVICE_URL: "http://payment-service:5000"
      COREDB_URL: "Host=${DB_HOST};Port=${DB_PORT};Database=core_db;Username=${DB_USERNAME};Password=${DB_PASSWORD};SSL Mode=Disable;"
    depends_on:
      core-db-migrate:
        condition: service_completed_successfully
    networks:
      - primum-network

  primumweb:
    build:
      context: Apps/PrimumWeb
      dockerfile: Dockerfile
    container_name: primumweb
    ports:
      - "3001:80"
    depends_on:
      - primumwebapi
    networks:
      - primum-network

networks:
  primum-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  mongo-data: