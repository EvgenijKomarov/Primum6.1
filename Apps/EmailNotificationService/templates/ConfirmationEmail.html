<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#1a1a1a;font-family:'Courier New', Courier, monospace;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#1a1a1a;padding:40px 0;">
        <tr>
            <td align="center">
                <table width="560" cellpadding="0" cellspacing="0"
                       style="background:#212121;border:1px solid #3a3a3a;border-radius:4px;">
                    <tr>
                        <td style="padding:32px 32px 0 32px;">
                            <span style="color:#c6ff00;font-size:20px;font-weight:bold;letter-spacing:1px;">
                                &gt; PrimumCode_
                            </span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:28px 32px 8px 32px;">
                            <h1 style="margin:0;color:#ffffff;font-size:24px;font-weight:bold;">
                                Подтверждение почты
                            </h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 24px 32px;color:#9a9a9a;font-size:15px;line-height:1.7;">
                            Для полного доступа на площадку подтвердите e-mail — нажмите кнопку ниже
                            или введите код вручную в личном кабинете.
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 28px 32px;">
                            <table cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="background:#c6ff00;border-radius:2px;">
                                        <a href="$link"
                                           style="display:inline-block;padding:14px 32px;color:#111111;
                                font-weight:bold;text-decoration:none;
                                font-family:'Courier New', Courier, monospace;
                                font-size:14px;letter-spacing:0.5px;">
                                            ПОДТВЕРДИТЬ ПОЧТУ →
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 8px 32px;color:#666666;font-size:12px;">
                            Или введите код подтверждения вручную:
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 32px 32px;">
                            <table cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="border:1px dashed #c6ff00;padding:14px 20px;border-radius:2px;">
                                        <span style="color:#c6ff00;font-size:18px;letter-spacing:3px;font-weight:bold;">
                                            $token
                                        </span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px;border-top:1px solid #3a3a3a;
                         color:#666666;font-size:12px;">
                            Если вы не регистрировались на PrimumCode — просто игнорируйте это письмо.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
