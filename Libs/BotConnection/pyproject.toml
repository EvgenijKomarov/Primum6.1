[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botconnection"
version = "0.1.0"
description = "Утилита для отправки сообщений чат ботов на ядро обработки"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31,<3.0",
    "pika>=1.3,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["botconnection*"]